name: Generate Next Security Upgrade

on:
  push:
    branches:
      - feature/portfolio-v1
    paths:
      - ".github/workflows/next-security-upgrade.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Generate patched lockfile
        run: pnpm up next@^15.5.24 eslint-config-next@^15.5.24 --lockfile-only

      - name: Validate frozen install
        run: pnpm install --frozen-lockfile

      - name: Upload upgraded manifests
        uses: actions/upload-artifact@v4
        with:
          name: next-security-upgrade
          path: |
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
