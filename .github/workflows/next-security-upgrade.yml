name: Generate Next Security Upgrade

on:
  push:
    branches:
      - feature/portfolio-v1
    paths:
      - ".github/workflows/next-security-upgrade.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Generate patched lockfile
        run: pnpm up next@^15.5.24 eslint-config-next@^15.5.24 --lockfile-only

      - name: Validate frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit generated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "security: upgrade Next.js maintenance LTS"
          git push origin HEAD:feature/portfolio-v1
